:root {
  --bg: #ebeae5;
  --fg: #161a1f;
  --muted: #5b636c;
  --rule: #c8cac4;
  --accent: #8a6a32;
  --plate: #d6d8d3;
  --night: #1b2026;
  --glow: #c9a464;
  --display: "Instrument Serif", Georgia, serif;
  --body: "Newsreader", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417; --fg: #e8e6e0; --muted: #9ba2aa; --rule: #2d3339;
    --accent: #d4ae6c; --plate: #1d2227; --night: #0c0e10; --glow: #d9b478;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121417; --fg: #e8e6e0; --muted: #9ba2aa; --rule: #2d3339;
  --accent: #d4ae6c; --plate: #1d2227; --night: #0c0e10; --glow: #d9b478;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.6;
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 56px;
}
.wrap { max-width: 1080px; margin: 0 auto; }

.dedication {
  font-family: var(--display);
  font-style: italic;
  font-size: clamp(1.3rem, 4vw, 1.9rem);
  color: var(--accent);
  text-align: center;
  padding: 6px 0 18px;
  margin: 0 0 8px;
  border-bottom: 1px dashed var(--rule);
}
.kicker {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 14px;
}
h1, h2, h3 { text-wrap: balance; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; }
h1 { font-size: clamp(3.2rem, 11vw, 8rem); line-height: 0.92; letter-spacing: -0.02em; }
h2 { font-size: clamp(2.1rem, 5vw, 3.2rem); line-height: 1.05; }

.hero {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 40px;
  align-items: end;
  padding-block: 28px 64px;
  border-bottom: 1px solid var(--rule);
}
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
.hero > div { min-width: 0; }
.lede { max-width: 34em; font-size: 1.18rem; margin: 26px 0 0; text-wrap: pretty; }
.dates { font-family: var(--display); font-style: italic; font-size: 1.6rem; color: var(--accent); margin: 18px 0 0; }

.plate { margin: 0; min-width: 0; }
.frame {
  position: relative;
  aspect-ratio: 4 / 5;
  max-width: 100%;
  background: linear-gradient(180deg, var(--night) 0%, #2a3139 100%);
  overflow: hidden;
}
.frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
figcaption {
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted);
  margin-top: 10px;
}

.sec { padding-block: 64px 0; }
.sec-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  flex-wrap: wrap;
  gap: 16px 24px;
  margin-bottom: 28px;
}

/* Story chapters */
.chapter {
  display: grid;
  grid-template-columns: minmax(0, 13rem) minmax(0, 1fr);
  gap: 8px 40px;
  padding-block: 30px;
  border-top: 1px solid var(--rule);
}
@media (max-width: 760px) { .chapter { grid-template-columns: minmax(0, 1fr); } }
.ch-meta .mood { font-family: var(--display); font-style: italic; font-size: 1.6rem; line-height: 1.1; color: var(--accent); margin: 0; }
.ch-meta .years { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; color: var(--muted); margin: 8px 0 0; }
.ch-body { min-width: 0; }
.ch-body h3 { font-size: clamp(1.5rem, 3.4vw, 2rem); line-height: 1.1; margin: 0 0 12px; }
.ch-body p { max-width: 36em; margin: 0 0 12px; text-wrap: pretty; }
.ch-fig { margin: 20px 0 0; max-width: 440px; }
.ch-fig img { width: 100%; height: auto; display: block; background: var(--plate); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; }
button.chip {
  font: inherit;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  padding: 8px 14px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--fg);
  cursor: pointer;
}
button.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.grid { column-width: 250px; column-gap: 32px; }
.work { margin: 0 0 44px; min-width: 0; break-inside: avoid; }
.work img { width: 100%; height: auto; display: block; background: var(--plate); }
.work .blank {
  aspect-ratio: 4 / 3;
  background: var(--plate);
  display: flex;
  align-items: end;
  padding: 10px;
  box-sizing: border-box;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--muted);
}
.work h3 { font-family: var(--body); font-weight: 500; font-size: 1.08rem; line-height: 1.3; margin: 0; }
.work .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0 0 6px; }
.work .meta a { color: var(--muted); text-underline-offset: 2px; }
.work .meta a:hover { color: var(--accent); }
.work .note { font-size: 0.98rem; color: var(--muted); margin: 8px 0 0; }
.work figcaption { margin-top: 12px; }

.timeline { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--rule); max-width: 46em; }
.timeline li {
  display: grid;
  grid-template-columns: 74px minmax(0, 1fr);
  gap: 16px;
  padding: 0 0 26px 24px;
  position: relative;
}
.timeline li::before {
  content: "";
  position: absolute;
  left: -5px;
  top: 8px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
}
.timeline time { font-family: var(--mono); font-size: 14px; color: var(--accent); padding-top: 4px; }
.timeline p { margin: 0; }

footer {
  margin-top: 80px;
  padding-top: 20px;
  border-top: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.7;
  color: var(--muted);

footer ul { list-style: none; margin: 8px 0 0; padding: 0; }
footer a { color: var(--muted); text-underline-offset: 2px; }
footer a:hover { color: var(--accent); }
img { max-width: 100%; }
[hidden] { display: none !important; }

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) for (const k in attrs) node.setAttribute(k, attrs[k]);
  (children || []).forEach(c => node.append(c));
  return node;
}
const byId = (id) => document.getElementById(id);
const imgOf = (w) => w.image ? el("img", { src: w.image, alt: w.title, loading: "lazy", width: String(w.imageSize[0]), height: String(w.imageSize[1]) }) : null;

// Dedication shows until its end date, then stays hidden.
if (artist.dedication && new Date() < new Date(artist.dedication.until)) {
  const d = byId("dedication");
  d.textContent = artist.dedication.text;
  d.hidden = false;
}

byId("name").textContent = artist.name;
byId("dates").textContent = artist.dates;
byId("lede").textContent = artist.intro[0];

const bySlug = {};
artist.works.forEach(w => { bySlug[w.slug] = w; });

const rocket = bySlug["falling-rocket"];
if (rocket && rocket.image) byId("hero-frame").append(el("img", { src: rocket.image, alt: rocket.title }));

function renderStory() {
  const box = byId("story");
  artist.story.forEach(ch => {
    const body = el("div", { class: "ch-body" }, [el("h3", null, [ch.heading])]);
    ch.paragraphs.forEach(t => body.append(el("p", null, [t])));
    const w = ch.image && bySlug[ch.image];
    if (w && w.image) {
      body.append(el("figure", { class: "ch-fig" }, [imgOf(w), el("figcaption", null, [ch.caption || w.title])]));
    }
    box.append(el("article", { class: "chapter" }, [
      el("div", { class: "ch-meta" }, [el("p", { class: "mood" }, [ch.mood]), el("p", { class: "years" }, [ch.years])]),
      body
    ]));
  });
}

function renderWorks(filter) {
  const grid = byId("works");
  grid.replaceChildren();
  artist.works
    .filter(w => filter === "All" || w.medium === filter)
    .forEach(w => {
      const title = w.nickname ? w.title + " (" + w.nickname + ")" : w.title;
      const cap = [
        el("p", { class: "meta" }, [[w.year, w.tech].filter(Boolean).join(" · ")]),
        el("h3", null, [title]),
        el("p", { class: "meta" }, [w.where])
      ];
      if (w.image && w.imageCredit) {
        cap.push(el("p", { class: "meta" }, ["Image: ", el("a", { href: w.imageCredit.url, target: "_blank", rel: "noreferrer" }, [w.imageCredit.label])]));
      }
      if (w.note) cap.push(el("p", { class: "note" }, [w.note]));
      grid.append(el("figure", { class: "work" }, [
        imgOf(w) || el("div", { class: "blank", role: "img", "aria-label": w.title }, ["Image to add"]),
        el("figcaption", null, cap)
      ]));
    });
}

function renderFilters() {
  const box = byId("filters");
  const options = ["All"].concat(artist.works.map(w => w.medium).filter((m, i, a) => a.indexOf(m) === i));
  options.forEach((label, i) => {
    const b = el("button", { type: "button", class: "chip", "aria-pressed": i === 0 ? "true" : "false" }, [label]);
    b.addEventListener("click", () => {
      box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      renderWorks(label);
    });
    box.append(b);
  });
}

function renderTimeline() {
  const list = byId("timeline");
  artist.timeline.forEach(([year, text]) => {
    list.append(el("li", null, [el("time", null, [year]), el("p", null, [text])]));
  });
}

function renderSources() {
  const list = byId("sources");
  artist.sources.forEach(([label, url]) => {
    list.append(el("li", null, [el("a", { href: url, target: "_blank", rel: "noreferrer" }, [label])]));
  });
}

renderStory();
renderFilters();
renderWorks("All");
renderTimeline();
renderSources();
</script>
